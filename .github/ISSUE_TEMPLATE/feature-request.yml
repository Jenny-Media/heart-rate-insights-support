name: Feature request
description: Suggest an improvement without sharing health or personal information.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. This issue will be public.

        **Describe the general need. Do not include Apple Health exports, PDF/CSV reports, health screenshots, exact heart-rate readings, dates, names, email addresses, or other personal information.**

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed health data and personal information from this request.
          required: true

  - type: textarea
    id: need
    attributes:
      label: What would you like to accomplish?
      description: Explain the general goal rather than including personal health details.
    validations:
      required: true

  - type: textarea
    id: current-workflow
    attributes:
      label: What do you do today?
      description: Describe the current workflow without health data.

  - type: textarea
    id: proposed-experience
    attributes:
      label: What experience would help?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Both
        - Not platform-specific
    validations:
      required: true
