name: Bug report
description: Report a reproducible problem without sharing health or personal information.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Heart Rate Insights. This issue will be public.

        **Do not attach Apple Health exports, PDF/CSV reports, health screenshots, exact heart-rate readings, dates, names, email addresses, or other personal information.** Use [private support](https://heart.jenny.media/support) when private information is necessary.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed health data and personal information from this report.
          required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Find this under Settings → App → About.
      placeholder: "1.4.2 (269)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: iPhone or iPad model
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: iOS or iPadOS version
      placeholder: "27.2"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible behavior without including health data.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Tap…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional non-sensitive context
      description: Do not add health screenshots, readings, reports, exports, or personal information.

